# LUDO-G1 training and inference configuration (CLAUDE.md 5.2, 5.3, 5.7).
#
# This file contains NO placeholders: every value here is a design choice from the brief, not a
# measurement of the hardware. `runtime.config.unmeasured("training")` must stay empty; a test
# asserts it. Anything that has to be measured belongs in robot.yaml, cameras.yaml, hand.yaml,
# safety.yaml or board.yaml instead.

# --- rates (5.2) ---------------------------------------------------------------------------------
rates:
  camera_hz: 30
  state_hz: 100          # where the SDK allows; subsampled to dataset_hz for the dataset
  dataset_hz: 30
  policy_hz: 10          # inference; each call emits a chunk
  action_hz: 30          # the rate the chunk is played out at

# --- observation and action spaces (5.3) ---------------------------------------------------------
observation:
  images:
    top: [640, 480]      # Brio, cropped to the board region first (config/cameras.yaml top.crop)
    oblique: [640, 480]  # Orbbec Ego left RGB (D-009)
    palm: [320, 240]     # DexH15 palm camera, downscaled
  # 7 arm joints + waist yaw + pinch scalar; the order is config/robot.yaml `action_order`.
  state_dim: 9
  # Two goal heatmap channels rendered into the `top` frame: source cell and target cell. For ROLL
  # and RECOVER the relevant channel points at the bowl or at the fallen horse.
  goal_channels: 2
  goal_sigma_px: 12.0
  task_ids: [move, roll, recover]
  # Recorded in every episode but not fed to the policy by default (5.3).
  extra_recorded:
    dexh15_joints: 15
    glove_channels: 17

action:
  dim: 9
  space: absolute_joint_targets
  hz: 30

# --- the control loop (5.5): runtime/controller.py -------------------------------------------------
# Design choices, not measurements, like everything else in this file.
runtime:
  # CLAUDE.md 5.5: "until the policy's own termination signal or a 20 s timeout".
  primitive_timeout_s: 20.0
  # How far from the observation instant a stream's nearest sample may be before runtime/clock.py
  # refuses to build an observation. The cameras and the hand run at 30 Hz, so a nearest sample is
  # inherently up to one 33.3 ms period old; 50 ms is that plus scheduling slack. This is NOT the
  # recorder's skew budget (CLAUDE.md Phase 2 asks for < 10 ms p99 there, on latency-compensated
  # streams); it is the live loop's tolerance for polling three free-running devices.
  alignment_tolerance_ms: 50.0
  # Heartbeat line rate to data/logs/controller_<session>.heartbeat (section 7).
  heartbeat_s: 1.0

# --- the teleop recorder (5.2, 5.6): teleop/recorder.py --------------------------------------------
# Design choices, not measurements. The per-path latencies the recorder compensates with are in
# config/robot.yaml `latency.*` and are Phase 1 measurements; nothing here is one.
recorder:
  # How many dataset periods behind `now` the frame written on a tick is. With a lag of one period
  # every stream has samples on both sides of the alignment instant, so runtime/clock.py `align`
  # picks the *nearest* sample rather than the newest-not-after: worst-case offset drops from a whole
  # stream period to half of one. 0 would double the skew and buy 33 ms of latency nobody needs,
  # because the recorder is not in the control loop.
  alignment_lag_periods: 1
  # How far from the alignment instant a stream's nearest sample may be before the frame is dropped.
  # Half a period of the slowest stream (the 30 Hz cameras) is 16.7 ms; this is that plus slack. It
  # is NOT the skew budget: CLAUDE.md Phase 2 asks for < 10 ms p99, which is what the card reports.
  alignment_tolerance_ms: 20.0
  # A gap between two consecutive samples of one stream longer than this many dataset periods is a
  # dropped frame on the dataset card. The dataset period is the yardstick for every stream: a
  # device faster than 30 Hz is polled once per tick and subsampled on purpose (5.2).
  drop_gap_periods: 1.5
  # false: camera frames are stored as lossless PNG image features instead of encoded video. Video
  # would be smaller, but the frames are what the goal-heatmap audit (CLAUDE.md section 8) and the
  # replay checks read back, and a lossy codec changes them. Flip it when disk, not fidelity, binds.
  use_videos: false
  # Threads lerobot's image writer uses. One 640x480 PNG costs ~8 ms here and a tick writes three,
  # which does not fit in 33 ms on one thread.
  image_writer_threads: 4

# --- the operator UI (Phase 2): teleop/operator_ui.py ----------------------------------------------
# Design choices, not measurements: which key does what, and how the goal display is drawn. The cells
# themselves come from the engine and their pixels from runtime/goal.py, never from here.
operator_ui:
  # One character per action. `y` and `n` are quoted because unquoted they are YAML 1.1 booleans.
  keys:
    start: s
    stop: x
    mark_success: "y"
    mark_failure: "n"
    toggle_perturbed: p
    abort: a
    quit: q
  # The two goal markers, drawn in the `top` frame at the cell pixels runtime/goal.py reports.
  marker_radius_px: 14
  marker_thickness_px: 2
  marker_dot_px: 2
  src_color_bgr: [0, 255, 0]        # source cell: green
  dst_color_bgr: [255, 0, 255]      # target cell: magenta
  # The text is drawn in a band *below* the image, never on top of it, so that what the operator
  # sees of the board is the frame the recorder stored, pixel for pixel, plus the two markers.
  banner_height_px: 76
  banner_color_bgr: [24, 24, 24]
  text_color_bgr: [235, 235, 235]
  font_scale: 0.45
  font_thickness: 1
  window_name: LUDO-G1 teleop

# --- primary policy: Diffusion Policy (5.7) ------------------------------------------------------
diffusion:
  base: lerobot_diffusion_policy
  vision_encoder: resnet18
  encoder_per_camera: true
  # One shape for all three cameras, in (h, w). lerobot's DiffusionConfig.validate_features refuses
  # camera features of different shapes, and `palm` is 320x240 while `top` and `oblique` are 640x480,
  # so policy/diffusion.py resizes every camera to this before the encoder. Chosen as the palm's own
  # resolution: the smallest frame the observation of 5.3 carries, so no camera is upsampled.
  encoder_image_hw: [240, 320]
  # The diffusion U-Net's per-stage channel widths (lerobot DiffusionConfig.down_dims) and the number
  # of SpatialSoftmax keypoints each ResNet-18 encoder reduces its feature map to; both are the
  # upstream Diffusion Policy defaults, recorded here because they set the parameter count.
  down_dims: [512, 1024, 2048]
  spatial_softmax_keypoints: 32
  # Samples policy/train.py draws to estimate the normalisation statistics (image mean/std, state and
  # action min/max). A full pass over a real session is minutes of PNG decoding for numbers that
  # converge in hundreds of samples; the run record says how many were drawn.
  stats_samples: 256
  chunk: 16
  execute: 8             # receding horizon: execute 8 of the 16 predicted actions
  obs_history: 2
  scheduler: ddim
  train_steps: 100
  inference_steps: 10    # fall back to 5, then to ACT, then to the Orin NX if 10 Hz does not hold
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  train_iterations: 200000
  ema_decay: 0.9999
  seed: 0

# --- baseline: ACT (5.7), trained on every dataset the diffusion model is trained on --------------
act:
  base: lerobot_act
  vision_encoder: resnet18
  encoder_per_camera: true
  chunk: 32
  temporal_ensemble: true
  temporal_ensemble_coeff: 0.01
  obs_history: 1
  batch_size: 8
  learning_rate: 1.0e-5
  weight_decay: 1.0e-4
  train_iterations: 100000
  kl_weight: 10.0
  seed: 0

# --- multi-task (5.7): one model over all three primitives ---------------------------------------
multitask:
  enabled: true
  task_conditioning: one_hot
  # Relative sampling weight per primitive, so a large move dataset does not drown roll and recover.
  sample_weights: {move: 1.0, roll: 1.0, recover: 1.0}

# --- augmentation (5.7) --------------------------------------------------------------------------
# NEVER geometric on `top`: the goal heatmap lives in the same frame and would stop matching.
augmentation:
  color_jitter: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.05}
  random_crop_ratio: 0.95
  random_crop_cameras: [oblique, palm]
  goal_heatmap_blur_px: [0.0, 4.0]
  geometric_on_top: false

# --- dataset (5.6) -------------------------------------------------------------------------------
dataset:
  # LeRobot v3.0, the CODEBASE_VERSION lerobot 0.4.4 writes and reads; CLAUDE.md 5.6 says "v2",
  # which no release installable on Python 3.10 produces any more (agents/DECISIONS.md D-015). The
  # observation, action and metadata content of 5.3 and 5.6 is unchanged by the version.
  format: lerobot_v3
  root: data/raw
  val_fraction: 0.1
  # Held-out cell pairs are chosen by eval/protocol.py from policy/dataset.py `split_cell_pairs`, not
  # by a random split: the split has to be over cell pairs, not over frames.
  split_by: cell_pair

# --- compute (5.8) -------------------------------------------------------------------------------
compute:
  train_target: greennode
  inference_target: laptop
  inference_fallback_order: [ddim_5, act, orin_nx]
  checkpoint_dir: data/checkpoints
  export_format: torchscript
