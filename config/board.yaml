    - {id: track-47, board_xy_mm: [-280.0, -40.0]}
    # --- red ---
    - {id: R-base-0, board_xy_mm: [120.0, 240.0]}
    - {id: R-base-1, board_xy_mm: [240.0, 240.0]}
    - {id: R-base-2, board_xy_mm: [120.0, 120.0]}
