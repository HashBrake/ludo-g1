    - {id: track-31, board_xy_mm: [40.0, -120.0]}
    - {id: track-32, board_xy_mm: [40.0, -160.0]}
    - {id: track-33, board_xy_mm: [40.0, -200.0]}
    - {id: track-34, board_xy_mm: [40.0, -240.0]}
    - {id: track-35, board_xy_mm: [40.0, -280.0]}
    - {id: track-36, board_xy_mm: [-40.0, -280.0]}
    - {id: track-37, board_xy_mm: [-40.0, -240.0]}
